name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得專案原始碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 設定 Gradle 環境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. 自動定位專案並打包 APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -f "Android_Reader_AdBlocker/settings.gradle.kts" ]; then
            cd Android_Reader_AdBlocker
            gradle assembleDebug
          else
            echo "❌ 找不到 settings.gradle.kts，請確認已將 Android_Reader_AdBlocker 的檔案上傳到 GitHub！"
            exit 1
          fi

      - name: 5. 上傳 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: SafariReader-AdBlocker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
